<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARP speech</title>
<!-- Served by web.py (context/speech-web.md). Self-contained: the robot network may have no internet. -->
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --panel-2: #f1f1ee; --line: #e3e2dd; --text: #1d1d1b;
  --muted: #6b6a65; --faint: #9a9993; --accent: #8c1515; --accent-text: #ffffff;
  --person: #1f5fbf; --person-bg: #e8f0fc; --harp-bg: #f1f1ee;
  --listening: #64748b; --hearing: #16a34a; --transcribing: #d97706; --muted-state: #7c3aed;
  --idle: #a8a29e; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  --level: #94a3b8; --prob: #1f5fbf; --grid: #ecebe7;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --panel-2: #262624; --line: #33322f; --text: #ecebe7;
    --muted: #a3a29c; --faint: #75746f; --accent: #c8423f; --accent-text: #ffffff;
    --person: #7aa7ec; --person-bg: #1e2b40; --harp-bg: #2a2a27;
    --listening: #94a3b8; --hearing: #4ade80; --transcribing: #fbbf24; --muted-state: #a78bfa;
    --idle: #57534e; --level: #52606f; --prob: #7aa7ec; --grid: #292927;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --panel-2: #262624; --line: #33322f; --text: #ecebe7;
  --muted: #a3a29c; --faint: #75746f; --accent: #c8423f; --accent-text: #ffffff;
  --person: #7aa7ec; --person-bg: #1e2b40; --harp-bg: #2a2a27;
  --listening: #94a3b8; --hearing: #4ade80; --transcribing: #fbbf24; --muted-state: #a78bfa;
  --idle: #57534e; --level: #52606f; --prob: #7aa7ec; --grid: #292927;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px;
  background: var(--panel-2); color: var(--muted); font-size: 12.5px; white-space: nowrap;
}
.chip b { color: var(--text); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
button {
  font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
}
button:hover:not(:disabled) { background: var(--panel-2); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.small { padding: 3px 10px; font-size: 12.5px; }
main {
  flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr);
  gap: 16px; padding: 16px 20px 20px;
}
aside { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); padding: 14px 16px;
}
.card h2 {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 0 0 12px;
}
.field { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; margin: 8px 0; }
.field > label:first-child { color: var(--muted); font-size: 13px; }
select, input[type=text] {
  font: inherit; width: 100%; padding: 6px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); min-width: 0;
}
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 3px; }
.segmented button { border: none; background: transparent; padding: 5px 4px; font-size: 12.5px; color: var(--muted); border-radius: 6px; }
.segmented button[aria-pressed=true] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.hint { color: var(--faint); font-size: 12px; margin: 2px 0 0; }
.llm-row { display: flex; align-items: center; gap: 8px; }
.llm-row .grow { flex: 1; color: var(--muted); font-size: 13px; }
fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
fieldset:disabled { opacity: .6; }

/* hearing */
.state { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.orb { width: 34px; height: 34px; border-radius: 50%; background: var(--idle); flex: none; position: relative; transition: background .15s; }
.orb::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; color: inherit; }
.orb.pulse::after { animation: pulse 1.2s ease-out infinite; }
@keyframes pulse { 0% { opacity: .55; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.35); } }
.state-text b { display: block; font-size: 15px; }
.state-text span { color: var(--muted); font-size: 12.5px; }
.meter { margin: 10px 0; }
.meter-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.meter-top .mono { color: var(--text); }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--level); transition: width .08s linear; }
.bar .mark { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--text); opacity: .55; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .6; }
canvas { width: 100%; height: 96px; display: block; border-radius: 8px; background: var(--panel-2); margin-top: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* timing */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.stat .label { font-size: 11.5px; color: var(--muted); line-height: 1.25; min-height: 2.5em; }
.stat .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat .value small { font-size: 12px; font-weight: 500; color: var(--muted); }
.stat .sub { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* conversation */
.talk { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 8px 12px; }
.tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { font-size: 11px; background: var(--panel-2); border-radius: 999px; padding: 1px 7px; margin-left: 4px; color: var(--muted); }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; }
.pane[hidden] { display: none; }
#conversation { display: flex; flex-direction: column; gap: 10px; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 380px; padding: 40px 0; }
.empty b { color: var(--text); display: block; font-size: 15px; margin-bottom: 6px; }
.msg { display: flex; gap: 10px; max-width: min(640px, 88%); }
.msg.person { align-self: flex-end; flex-direction: row-reverse; }
.avatar { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--accent); color: var(--accent-text); }
.person .avatar { background: var(--person); }
.bubble { padding: 8px 12px; border-radius: 14px; background: var(--harp-bg); }
.person .bubble { background: var(--person-bg); border-top-right-radius: 4px; }
.harp .bubble { border-top-left-radius: 4px; }
.bubble .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.person .meta { justify-content: flex-end; }
.tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px; border-radius: 4px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.msg.faded .bubble { opacity: .55; }
.msg.faded .text { text-decoration: line-through; text-decoration-color: var(--faint); }
.note { align-self: center; color: var(--faint); font-size: 12.5px; text-align: center; max-width: 80%; }
.note.warn { color: var(--warn); }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 6px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.typing .bubble { display: inline-flex; gap: 4px; align-items: center; padding: 12px 14px; }
.typing .bubble i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
.typing .bubble i:nth-child(2) { animation-delay: .2s; } .typing .bubble i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--panel); }
.composer input { flex: 1; padding: 9px 12px; }
#log { font-size: 12px; line-height: 1.55; }
.log-line { display: grid; grid-template-columns: 64px 52px minmax(0, 1fr); gap: 8px; }
.log-line .src { font-weight: 600; }
.log-line .src.listen { color: var(--hearing); } .log-line .src.talk { color: var(--accent); }
.log-line .src.web { color: var(--muted); } .log-line .src.llm { color: var(--transcribing); }
.log-line .when { color: var(--faint); }
.log-line .line { white-space: pre-wrap; overflow-wrap: anywhere; }
.log-line.error .line { color: var(--bad); }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px;
  box-shadow: 0 6px 24px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
@media (max-width: 880px) {
  main { grid-template-columns: 1fr; padding: 12px 16px 16px; }
  aside { overflow: visible; }
  .talk { min-height: 70vh; }
  header { padding: 10px 16px; }
}
@media (prefers-reduced-motion: reduce) { .orb.pulse::after, .typing .bubble i { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>HARP speech</h1><span>listening and talking</span></div>
  <div class="chips">
    <span class="chip" id="llm-chip-wrap" title="llama-server"><span class="dot" id="llm-dot"></span>LLM <b id="llm-chip">checking</b></span>
    <span class="chip"><span class="dot" id="listen-dot"></span>Listening <b id="listen-chip">off</b></span>
    <span class="chip"><span class="dot" id="talk-dot"></span>Talking <b id="talk-chip">off</b></span>
  </div>
  <button class="primary" id="go">Start</button>
</header>

<main>
  <aside>
    <section class="card">
      <h2>Setup</h2>
      <fieldset id="setup">
        <div class="segmented" role="group" aria-label="What to run">
          <button type="button" data-mode="both" aria-pressed="true">Conversation</button>
          <button type="button" data-mode="listen" aria-pressed="false">Listen only</button>
          <button type="button" data-mode="talk" aria-pressed="false">Typed only</button>
        </div>
        <div data-for="listen">
          <div class="field"><label for="source">Hear from</label>
            <select id="source">
              <option value="mic">This computer's mic</option>
              <option value="robot">The robot's mic</option>
              <option value="wav">A recording</option>
            </select></div>
          <div class="field" data-source="mic"><label for="device">Microphone</label><select id="device"></select></div>
          <div class="field" data-source="wav"><label for="wav">WAV file</label><input type="text" id="wav" class="mono" placeholder="path, from speech/"></div>
          <div class="field" data-source="wav"><span></span><label class="check"><input type="checkbox" id="realtime" checked> At its own speed</label></div>
          <div class="field" data-source="robot"><label for="iface">Address</label><input type="text" id="iface" class="mono" placeholder="192.168.123.164 (PC2)"></div>
          <div class="field"><label for="turn">Turn end</label>
            <select id="turn"><option value="smart">Smart Turn</option><option value="fixed">0.7 s of silence</option></select></div>
        </div>
        <div data-for="talk">
          <div class="field"><label for="voice">Voice</label>
            <select id="voice"><option value="kokoro">Kokoro (af_heart)</option><option value="piper">Piper (ljspeech)</option></select></div>
          <div class="field"><label for="output">Speaker</label><select id="output"></select></div>
          <div class="field"><span></span><label class="check"><input type="checkbox" id="play" checked> Play out loud</label></div>
        </div>
      </fieldset>
      <div class="field" data-for="talk"><label>LLM</label>
        <div class="llm-row"><span class="grow" id="llm-text">checking</span><button class="small" id="llm-button" hidden>Start</button></div></div>
      <p class="hint" id="setup-hint"></p>
    </section>

    <section class="card" data-for="listen" id="hearing">
      <h2>Hearing</h2>
      <div class="state">
        <div class="orb" id="orb"></div>
        <div class="state-text"><b id="state-name">Off</b><span id="state-help">Start to listen.</span></div>
      </div>
      <div class="meter">
        <div class="meter-top"><span>Loudness</span><span class="mono" id="db-text">–</span></div>
        <div class="bar" title="dBFS, -80 to 0; the line is the room's noise floor"><div class="fill" id="db-fill"></div><div class="mark" id="floor-mark" hidden></div></div>
      </div>
      <div class="meter">
        <div class="meter-top"><span>Voice (Silero)</span><span class="mono" id="prob-text">–</span></div>
        <div class="bar" title="Speech starts at 0.6, a frame is silence under 0.45"><div class="fill" id="prob-fill" style="background: var(--prob)"></div>
          <div class="tick" style="left: 45%"></div><div class="tick" style="left: 60%"></div></div>
      </div>
      <canvas id="chart" aria-label="Loudness and voice probability over the last 12 seconds"></canvas>
      <div class="legend">
        <span><i style="background: var(--prob)"></i>voice</span>
        <span><i style="background: var(--level)"></i>loudness</span>
        <span><i style="background: var(--hearing)"></i>hearing</span>
        <span><i style="background: var(--muted-state)"></i>muted</span>
      </div>
    </section>

    <section class="card">
      <h2>Timing <span style="text-transform: none; letter-spacing: 0; font-weight: 400">(median)</span></h2>
      <div class="stats">
        <div class="stat"><div class="label">Quiet to text</div><div class="value" id="stat-heard">–</div><div class="sub" id="stat-heard-sub"></div></div>
        <div class="stat"><div class="label">LLM's first sentence</div><div class="value" id="stat-llm">–</div><div class="sub" id="stat-llm-sub"></div></div>
        <div class="stat"><div class="label">Line to first sound</div><div class="value" id="stat-sound">–</div><div class="sub" id="stat-sound-sub"></div></div>
      </div>
    </section>
  </aside>

  <section class="card talk">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="conversation">Conversation</button>
      <button role="tab" aria-selected="false" data-tab="log">Log <span class="count" id="log-count">0</span></button>
    </div>
    <div class="pane" id="conversation-pane"><div id="conversation" aria-live="polite"></div></div>
    <div class="pane mono" id="log-pane" hidden><div id="log"></div></div>
    <form class="composer" id="composer">
      <input type="text" id="say" autocomplete="off" placeholder="Start talking to type what the person says" disabled>
      <button class="primary" id="send" disabled>Send</button>
    </form>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const STATES = {
  off: ["Off", "Start to listen.", "--idle"],
  starting: ["Loading", "Loading the models.", "--idle"],
  listening: ["Listening", "Waiting for someone to speak.", "--listening"],
  hearing: ["Hearing", "Someone is speaking.", "--hearing"],
  transcribing: ["Transcribing", "Turning the turn into text.", "--transcribing"],
  muted: ["Muted", "HARP is speaking, so it isn't listening.", "--muted-state"],
  ended: ["Stopped", "Listening has ended.", "--idle"],
};
const SAVED = ["source", "device", "wav", "realtime", "iface", "turn", "voice", "output", "play"];
const CHART_S = 12;

let mode = "both", running = false, talkReady = false, config = null, llm = "down", llmHere = false, llmUrl = "";
let listenState = "off", pending = 0, levels = [], logCount = 0;
let stats = { heard: [], llm: [], sound: [] };
let lastHarp = null;

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function store(key, value) { try { localStorage.setItem("harp-speech-" + key, JSON.stringify(value)); } catch (e) {} }
function recall(key) { try { const v = localStorage.getItem("harp-speech-" + key); return v === null ? undefined : JSON.parse(v); } catch (e) { return undefined; } }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function secs(v) { return v === undefined || v === null ? null : (+v).toFixed(2) + " s"; }

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
}

async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { toast(data.error || ("Failed: " + r.status)); return false; }
    return true;
  } catch (e) { toast("The speech server isn't answering. Is web.py running?"); return false; }
}

/* setup form */
function setMode(m) {
  mode = m;
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  const listen = m !== "talk", talk = m !== "listen";
  document.querySelectorAll('[data-for="listen"]').forEach(e => e.hidden = !listen);
  document.querySelectorAll('[data-for="talk"]').forEach(e => e.hidden = !talk);
  store("mode", m); showSource(); updateControls();
}
function showSource() {
  const s = $("source").value;
  document.querySelectorAll("[data-source]").forEach(e => e.hidden = e.dataset.source !== s);
  $("setup-hint").textContent = mode === "talk" ? "Type what the person says; HARP answers out loud." :
    s === "mic" ? "On macOS, the terminal running web.py needs microphone access (System Settings, Privacy & Security)." :
    s === "robot" ? "Needs the robot's voice assistant in wake-up mode: ask the team before switching it." :
    "A 16-bit WAV, played through listening as if someone were speaking.";
}
function gather() {
  const v = id => $(id).value, n = id => $(id).value === "" ? null : +$(id).value;
  return { listen: mode !== "talk", talk: mode !== "listen", source: v("source"), device: n("device"),
    wav: v("wav").trim(), realtime: $("realtime").checked, iface: v("iface").trim() || null,
    fixed_turn: v("turn") === "fixed", voice: v("voice"), play: $("play").checked, output_device: n("output") };
}
function saveForm() { SAVED.forEach(id => store(id, $(id).type === "checkbox" ? $(id).checked : $(id).value)); }
function loadForm() {
  SAVED.forEach(id => { const v = recall(id); if (v === undefined) return; if ($(id).type === "checkbox") $(id).checked = v; else if (id !== "device" && id !== "output") $(id).value = v; });
}
async function loadDevices() {
  try {
    const d = await (await fetch("/api/devices")).json();
    for (const [id, list] of [["device", d.inputs], ["output", d.outputs]]) {
      const sel = $(id); sel.innerHTML = "";
      const def = el("option", "", "Default"); def.value = ""; sel.append(def);
      (list || []).forEach(x => { const o = el("option", "", x.name + (x.default ? " (default)" : "")); o.value = x.index; sel.append(o); });
      const saved = recall(id); if (saved !== undefined && [...sel.options].some(o => o.value === saved)) sel.value = saved;
    }
  } catch (e) {}
}

/* status */
async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    llm = s.llm; llmHere = s.llm_started_here; llmUrl = s.llm_url || "";
    if (s.running !== running) { running = s.running; talkReady = s.talk_ready; config = s.config; }
  } catch (e) { llm = "unknown"; }
  updateControls();
}
function chip(dot, text, label, color) { $(dot).style.background = cssVar(color); $(text).textContent = label; }
function updateControls() {
  const llmLabel = { ok: "ready", loading: "loading", down: "off", unknown: "no server" }[llm] || llm;
  chip("llm-dot", "llm-chip", llmLabel, llm === "ok" ? "--ok" : llm === "loading" ? "--warn" : "--idle");
  $("llm-text").textContent = llm === "ok" ? "Ready at " + llmUrl.replace(/^https?:\/\//, "") + (llmHere ? " (started here)" : "") :
    llm === "loading" ? "Loading the model (about 10 s)" : "Not running";
  $("llm-chip-wrap").title = "llama-server at " + llmUrl;
  $("llm-button").hidden = !(llm === "down" || llmHere);
  $("llm-button").textContent = llm === "down" ? "Start" : "Stop";
  const listening = running && config && config.listen, talking = running && config && config.talk;
  const st = listening ? listenState : "off";
  chip("listen-dot", "listen-chip", listening ? STATES[st][0].toLowerCase() : "off", listening ? STATES[st][2] : "--idle");
  const talkLabel = !talking ? "off" : !talkReady ? "loading" : pending > 0 ? "replying" : "ready";
  chip("talk-dot", "talk-chip", talkLabel, !talking ? "--idle" : !talkReady ? "--warn" : pending > 0 ? "--transcribing" : "--ok");
  $("setup").disabled = running;
  $("go").textContent = running ? "Stop" : "Start";
  $("go").classList.toggle("primary", !running);
  const canSay = talking && talkReady;
  $("say").disabled = $("send").disabled = !canSay;
  $("say").placeholder = !talking ? "Start a conversation to type what the person says" :
    !talkReady ? "Waiting for HARP's greeting" : "Type what the person says, then Enter";
}

/* hearing */
function setListenState(s) {
  listenState = s;
  const [name, help, color] = STATES[s] || STATES.off;
  $("state-name").textContent = name; $("state-help").textContent = help;
  const orb = $("orb"); orb.style.background = cssVar(color); orb.style.color = cssVar(color);
  orb.classList.toggle("pulse", s === "hearing" || s === "muted");
  updateControls();
}
function level(m) {
  const pct = db => Math.max(0, Math.min(100, (db + 80) / 80 * 100));
  $("db-fill").style.width = pct(m.db) + "%"; $("db-text").textContent = m.db.toFixed(0) + " dB";
  const mark = $("floor-mark");
  if (m.floor_db !== null && m.floor_db !== undefined) { mark.hidden = false; mark.style.left = pct(m.floor_db) + "%"; } else mark.hidden = true;
  $("prob-fill").style.width = (m.prob * 100) + "%"; $("prob-text").textContent = m.prob.toFixed(2);
  $("db-fill").style.background = cssVar(listenState === "hearing" ? "--hearing" : listenState === "muted" ? "--muted-state" : "--level");
  levels.push({ t: m.t, db: m.db, prob: m.prob, floor: m.floor_db, state: listenState });
  const since = m.t - CHART_S; while (levels.length && levels[0].t < since) levels.shift();
  drawSoon();
}
let drawQueued = false;
function drawSoon() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); } }
function draw() {
  drawQueued = false;
  const c = $("chart"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const band = 5, top = 6, plot = h - band - top - 4;
  const end = levels.length ? levels[levels.length - 1].t : CHART_S;
  const x = t => w - (end - t) / CHART_S * w, y = v => top + plot * (1 - v);
  g.strokeStyle = cssVar("--grid"); g.lineWidth = 1;
  for (const v of [0.25, 0.5, 0.75]) { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(w, y(v)); g.stroke(); }
  g.setLineDash([3, 3]); g.strokeStyle = cssVar("--faint");
  for (const v of [0.45, 0.6]) { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(w, y(v)); g.stroke(); }
  g.setLineDash([]);
  if (!levels.length) return;
  const lv = db => Math.max(0, Math.min(1, (db + 80) / 80));
  g.beginPath(); g.moveTo(x(levels[0].t), y(0));
  levels.forEach(p => g.lineTo(x(p.t), y(lv(p.db))));
  g.lineTo(x(end), y(0)); g.closePath(); g.globalAlpha = 0.5; g.fillStyle = cssVar("--level"); g.fill(); g.globalAlpha = 1;
  g.beginPath(); levels.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, x(p.t), y(p.prob)));
  g.strokeStyle = cssVar("--prob"); g.lineWidth = 1.75; g.stroke();
  const colors = { hearing: "--hearing", transcribing: "--transcribing", muted: "--muted-state" };
  levels.forEach((p, i) => {
    if (!colors[p.state]) return;
    const x0 = x(p.t), x1 = i + 1 < levels.length ? x(levels[i + 1].t) : w;
    g.fillStyle = cssVar(colors[p.state]); g.fillRect(x0, h - band, Math.max(1, x1 - x0), band);
  });
}

/* conversation */
function conv() { return $("conversation"); }
function scrollDown() { const p = $("conversation-pane"); p.scrollTop = p.scrollHeight; }
function clearEmpty() { const e = conv().querySelector(".empty"); if (e) e.remove(); }
function showEmpty() {
  conv().innerHTML = "";
  const e = el("div", "empty"); e.append(el("b", "", "No conversation yet"));
  e.append(document.createTextNode("Pick what to run and press Start. HARP greets the person, then answers each thing they say. Each line shows how long it took."));
  conv().append(e);
}
function add(node) {
  clearEmpty();
  const typing = conv().querySelector(".typing");
  if (typing && !node.classList.contains("typing")) conv().insertBefore(node, typing); else conv().append(node);
  scrollDown(); return node;
}
function message(who, text, metaParts, tags) {
  const m = el("div", "msg " + who), b = el("div", "bubble");
  m.append(el("div", "avatar", who === "harp" ? "H" : "P"));
  b.append(el("div", "text", text));
  const meta = el("div", "meta");
  (tags || []).forEach(t => meta.append(el("span", "tag", t)));
  (metaParts || []).filter(Boolean).forEach(t => meta.append(el("span", "", t)));
  if (meta.childNodes.length) b.append(meta);
  m.append(b); return add(m);
}
function note(text, cls) { return add(el("div", "note" + (cls ? " " + cls : ""), text)); }
function divider(text) { return add(el("div", "divider", text)); }
function setTyping(on) {
  const t = conv().querySelector(".typing");
  if (on && !t) { const m = el("div", "msg harp typing"); m.append(el("div", "avatar", "H")); const b = el("div", "bubble"); b.append(el("i"), el("i"), el("i")); m.append(b); add(m); }
  if (!on && t) t.remove();
}
function expectReply() { pending++; setTyping(true); updateControls(); }
function replied() { pending = Math.max(0, pending - 1); if (!pending) setTyping(false); updateControls(); }

function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), i = s.length >> 1; return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2; }
function stat(key, value) {
  if (value !== undefined && value !== null && value > 0) stats[key].push(+value);
  const a = stats[key], m = median(a);
  $("stat-" + key).innerHTML = m === null ? "–" : m.toFixed(2) + "<small> s</small>";
  $("stat-" + key + "-sub").textContent = a.length ? "last " + a[a.length - 1].toFixed(2) + " s, " + a.length + (a.length === 1 ? " turn" : " turns") : "";
}

function logLine(source, text, when, error) {
  const line = el("div", "log-line" + (error ? " error" : ""));
  line.append(el("span", "when", new Date(when * 1000).toLocaleTimeString([], { hour12: false })));
  line.append(el("span", "src " + source, source));
  line.append(el("span", "line", text));
  const pane = $("log-pane"), atEnd = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 20;
  $("log").append(line); $("log-count").textContent = ++logCount;
  if (atEnd) pane.scrollTop = pane.scrollHeight;
}

const DROPPED = { short: "Ignored a short sound", empty: "Heard someone, but no words came out", made_up: "Ignored noise heard as words" };

function handle(m) {
  const { source, event } = m;
  if (event === "hello") { reset(); return; }
  if (event === "log") { logLine(source, m.text, m.time, /error|failed|missing|Traceback/i.test(m.text)); return; }
  if (source === "listen" && event === "level") { level(m); return; }
  if (source === "listen" && event === "state") { setListenState(m.state); return; }
  if (event === "exit") {
    logLine(source, "exited" + (m.code ? " with code " + m.code : ""), m.time, !!m.code);
    if (m.code && m.code !== -2 && m.code !== 130) note((source === "listen" ? "Listening" : source === "talk" ? "Talking" : "The LLM server") + " stopped with an error: see the Log.", "warn");
    if (source === "listen") setListenState("ended");
    return;
  }
  if (source === "web" && event === "session") {
    if (m.state === "started") {
      running = true; talkReady = false; config = m.config; pending = 0; levels = [];
      stats = { heard: [], llm: [], sound: [] }; ["heard", "llm", "sound"].forEach(k => stat(k));
      const parts = [];
      if (m.config.listen) parts.push("listening to " + ({ mic: "the mic", robot: "the robot's mic", wav: "a recording" })[m.config.source]);
      if (m.config.talk) parts.push("talking with " + (m.config.voice === "kokoro" ? "Kokoro" : "Piper"));
      divider("Started " + parts.join(", ") + " at " + new Date(m.time * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
      setListenState(m.config.listen ? "starting" : "off");
    } else {
      running = false; pending = 0; setTyping(false); divider("Stopped");
      if (listenState !== "off") setListenState("ended");
    }
    updateControls(); return;
  }
  if (source === "web" && event === "talk_ready") { talkReady = true; updateControls(); return; }
  if (source === "web" && event === "typed") {
    message("person", m.text, [], ["typed"]);
    if (m.forwarded) expectReply(); return;
  }
  if (source === "listen" && event === "turn") {
    if (m.dropped === "short" || m.dropped === "made_up") {
      note(DROPPED[m.dropped] + (m.text ? ': "' + m.text + '"' : "")); return;
    }
    const meta = [secs(m.after_end_s) && "text " + secs(m.after_end_s) + " after quiet",
      "speech-to-text " + secs(m.stt_s), m.finished !== undefined && "finished " + Math.round(m.finished * 100) + "%"];
    if (m.dropped === "empty") note(DROPPED.empty);
    else { const msg = message("person", m.text, meta); msg.dataset.text = m.text; stat("heard", m.after_end_s); }
    if (m.forwarded) expectReply();
    else if (config && config.talk && m.text) note("HARP wasn't ready yet, so it won't answer this", "warn");
    return;
  }
  if (source === "talk") {
    if (event === "said") {
      const tags = m.filler ? ["filler"] : m.canned ? ["fixed line"] : [];
      const meta = m.canned ? [] : [secs(m.first_sound_s) && "first sound " + secs(m.first_sound_s),
        secs(m.llm_s) && "LLM " + secs(m.llm_s), secs(m.ready_s) && "audio " + secs(m.ready_s)];
      lastHarp = message("harp", m.text, meta, tags);
      if (!m.canned) { stat("llm", m.llm_s); stat("sound", m.first_sound_s); }
      if (!m.filler) replied();
      return;
    }
    if (event === "echo") {
      const mine = [...conv().querySelectorAll(".msg.person")].reverse().find(e => e.dataset.text === m.text);
      if (mine) { mine.classList.add("faded"); (mine.querySelector(".meta") || mine.querySelector(".bubble")).append(el("span", "tag", "HARP's own voice: ignored")); }
      else note('Ignored HARP\'s own voice: "' + m.text + '"');
      replied(); return;
    }
    if (event === "unknown_words") { note("The voice skipped words it can't say: " + m.words.join(", "), "warn"); return; }
    if (event === "ignored_bye") { logLine("talk", "ignored a <bye> on a reply that isn't a goodbye", m.time); return; }
    if (event === "done") {
      const why = { bye: "HARP said goodbye", goodbye: "they said goodbye", misses: "nothing was heard twice", time: "it ran long", input_ended: "stopped" }[m.reason] || m.reason;
      divider("Conversation over: " + why + ", " + m.turns + (m.turns === 1 ? " turn, " : " turns, ") + m.seconds + " s");
      return;
    }
  }
}

function reset() {
  showEmpty(); $("log").innerHTML = ""; logCount = 0; $("log-count").textContent = 0;
  pending = 0; levels = []; stats = { heard: [], llm: [], sound: [] }; ["heard", "llm", "sound"].forEach(k => stat(k));
  setListenState("off"); drawSoon();
}

function connect() {
  const source = new EventSource("/events");
  source.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  source.onerror = () => { llm = "unknown"; updateControls(); };
}

/* wiring */
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("source").addEventListener("change", () => { showSource(); saveForm(); });
SAVED.forEach(id => $(id).addEventListener("change", saveForm));
$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  if (running) await post("/api/stop"); else { saveForm(); await post("/api/start", gather()); }
  $("go").disabled = false; poll();
});
$("llm-button").addEventListener("click", async () => {
  $("llm-button").disabled = true;
  await post(llm === "down" ? "/api/llm/start" : "/api/llm/stop");
  $("llm-button").disabled = false; poll();
});
$("composer").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("say").value.trim(); if (!text) return;
  if (await post("/api/say", { text })) $("say").value = "";
  $("say").focus();
});
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
  $("conversation-pane").hidden = b.dataset.tab !== "conversation";
  $("log-pane").hidden = b.dataset.tab !== "log";
  if (b.dataset.tab === "log") $("log-pane").scrollTop = $("log-pane").scrollHeight;
}));
window.addEventListener("resize", drawSoon);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawSoon(); setListenState(listenState); });

loadForm(); setMode(recall("mode") || "both"); showEmpty(); setListenState("off");
loadDevices(); poll(); setInterval(poll, 3000); connect();
</script>
</body>
</html>
