# Laptop / simulation: fake sensors, nothing is sent to the robot.

robot_bridge:
  ros__parameters:
    dry_run: true
    max_vx: 0.3        # m/s
    max_vyaw: 0.5      # rad/s
    cmd_timeout: 0.5   # s without a command before stopping

perception:
  ros__parameters:
    fake_people: true
    publish_rate: 5.0

voice:
  ros__parameters:
    fake_speech: true
    fake_speech_period: 5.0

behavior:
  ros__parameters:
    turn_gain: 0.8
    turn_deadband: 0.1
