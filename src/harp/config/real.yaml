# On the robot's Jetson. Real sensors, but still dry run: robot_bridge refuses
# dry_run: false until the hardware path is written and tested in a harness.

robot_bridge:
  ros__parameters:
    dry_run: true
    max_vx: 0.2        # m/s, slower than sim on purpose
    max_vyaw: 0.4      # rad/s
    cmd_timeout: 0.5   # s without a command before stopping

perception:
  ros__parameters:
    fake_people: false
    publish_rate: 5.0

voice:
  ros__parameters:
    fake_speech: false
    fake_speech_period: 5.0

behavior:
  ros__parameters:
    turn_gain: 0.8
    turn_deadband: 0.1
