# Nav2 (Foxy) for the G1: go to a pose a few meters away around obstacles, seen
# by the head lidar, with no map. Everything is in the odom frame of
# harp/state.py (the sim's true position, or leg odometry), so goals are in that frame.
#
# Starting points: nav2_bringup's params and Adyansh04/grove-g1 (a G1 with its
# own walking policy in MuJoCo). Reasons for our values are next to them;
# details in context/lidar-nav2-research.md.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    # default_bt_xml_filename (our navigate.xml) is set by nav2.launch.py.
    # Only navigate.xml's nodes: Foxy's default list names a library it doesn't ship.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5   # we never command sideways steps
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Turning in place and GR00T's slow start look like no progress for a while.
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # GR00T drifts about 0.1 m after it stops.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
    FollowPath:
      # Foxy has no Graceful Controller (the law of move_distance --to); Regulated
      # Pure Pursuit also follows NavFn's path, turning in place first when far off it.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      transform_tolerance: 0.5
      # GR00T walks at about 85% of the command, and below |cmd| 0.05 it
      # switches to standing still, so the minimums stay well above that.
      desired_linear_vel: 0.3
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.75
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 2.0
      use_approach_linear_velocity_scaling: true
      min_approach_linear_velocity: 0.1
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: false
      max_allowed_time_to_collision: 1.0

# Both costmaps read the head lidar the same way, through STVL
# (spatio_temporal_voxel_layer), whose marks fade:
#  - marking: points 0.08-1.8 m above the floor, up to 3 m away. Past 3 m,
#    torso tilt makes floor points look like obstacles. STVL has no minimum
#    range, so the robot's own arms get marked, but they are always inside the
#    footprint (0.355 m from base_link, robot_radius 0.4), which STVL clears.
#  - clearing: marks inside the lidar's view (to 3 m) that aren't hit again
#    fade within about 2 s (decay_acceleration), so a person's trail goes
#    away. STVL's lidar view is symmetric about the lidar's plane, so +-52 deg
#    covers the MID-360's 52 deg down but also 7-52 deg up, which it can't
#    see; only things above the lidar (1.21 m) are affected.
#  - everything else (the blind ring near the feet, beyond 3 m, behind the
#    arms) fades after voxel_decay, 15 s.
#  - no unknown space: STVL never marks cells free, so with
#    track_unknown_space the map stayed unknown around the obstacles, the
#    inflation layer left no cost gradient there (it only spreads its
#    lethal/inscribed costs into unknown cells), and NavFn's paths hugged
#    every obstacle.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.4
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        decay_model: 0       # linear
        voxel_decay: 15.0    # s an unseen mark lasts outside the lidar's view
        mark_threshold: 0
        track_unknown_space: false
        update_footprint_enabled: true
        combination_method: 1   # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_marking lidar_clearing
        lidar_marking:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.08
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clearing:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: false
          clearing: true
          model_type: 1               # 3D lidar
          min_z: 0.0                  # m from the lidar, in its plane
          max_z: 3.0                  # the marking range
          vertical_fov_angle: 1.815   # +-52 deg
          vertical_fov_padding: 0.05  # m
          horizontal_fov_angle: 6.29  # all around
          decay_acceleration: 10.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      update_frequency: 2.0
      publish_frequency: 1.0
      # No map: a window that moves with the robot, big enough for goals
      # about 9 m away (it is centered on the robot).
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      robot_radius: 0.4
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      # The same lidar layer and inflation as the local costmap.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        decay_model: 0       # linear
        voxel_decay: 15.0    # s an unseen mark lasts outside the lidar's view
        mark_threshold: 0
        track_unknown_space: false
        update_footprint_enabled: true
        combination_method: 1   # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_marking lidar_clearing
        lidar_marking:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.08
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clearing:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: false
          clearing: true
          model_type: 1               # 3D lidar
          min_z: 0.0                  # m from the lidar, in its plane
          max_z: 3.0                  # the marking range
          vertical_fov_angle: 1.815   # +-52 deg
          vertical_fov_padding: 0.05  # m
          horizontal_fov_angle: 6.29  # all around
          decay_acceleration: 10.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true   # plan through unknown space (there is none with STVL, see above)

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Only turning and waiting: backing up is risky for a walking robot.
    recovery_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server", "planner_server", "recoveries_server", "bt_navigator"]
