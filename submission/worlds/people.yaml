# The behavior loop on this world (course.py people): task is what course.py passes as
# G1_TASK_COMMAND (harp/behavior.py), the seed fixing its wander points.
# A behavior run lasts max_time_s (plus STARTUP), and its seconds are from the loop's
# start to its first talk. Each talk is scored over the talk itself: the true distance
# from the robot to that person's centre, and how far the robot faces from them.
# speed_near_people_mps isn't checked: walking up to someone standing counts as
# coming closer to them. First guesses until there are runs.
task: {"behavior": {"radius": 2.5, "seed": 1}}
must_succeed: true
max_time_s: 150
min_talks: 2
talk_distance_m: [0.7, 1.3]
max_talk_facing_deg: 25
min_clearance_m: 0.25
max_contacts: 0
