# Pass criteria for course tests on this world (runs check, summary.json).
# The robot should stand while the person comes at it (harp/approach_stop.py):
# max_speed_near_people_mps covers that (GR00T's standing sway stays well under
# it). Standing, the person misses its arm by about 0.2 m; min_clearance_m
# allows for spread. Times are first guesses until there are runs.
must_succeed: true
max_time_s: 45
min_clearance_m: 0.15
max_contacts: 0
max_speed_near_people_mps: 0.1
max_recoveries: 1
max_end_error_m: 0.35
