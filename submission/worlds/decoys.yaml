# The behavior loop on this world (course.py decoys): task is what course.py passes as
# G1_TASK_COMMAND (harp/behavior.py). not_people: candidates it should find aren't people
# (a not_a_person event) and never talk to. Each talk is scored as in people.yaml.
task: {"behavior": {"radius": 2.5, "seed": 1}}
must_succeed: true
max_time_s: 90
first_talk: person
min_talks: 1
not_people: [pillar]
talk_distance_m: [0.7, 1.3]
max_talk_facing_deg: 25
min_clearance_m: 0.25
max_contacts: 0
