# The behavior loop on this world (course.py people_ahead): task is what course.py passes
# as G1_TASK_COMMAND (harp/behavior.py). A behavior run lasts max_time_s (plus STARTUP).
# first_talk and max_first_talk_s (from the loop's start) check it walks up to the person
# ahead first, as only the lidar with the face visor off can make it do (people_ahead.xml):
# with the visor on (harp/lidar_mount.py) the run fails them, by design. Each talk is
# scored as in people.yaml.
task: {"behavior": {"radius": 2.5, "seed": 1}}
must_succeed: true
max_time_s: 100
first_talk: person_ahead
max_first_talk_s: 20
min_talks: 2
talk_distance_m: [0.7, 1.3]
max_talk_facing_deg: 25
min_clearance_m: 0.25
max_contacts: 0
