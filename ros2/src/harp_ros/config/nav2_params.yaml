# Nav2 for the G1: go to a pose a few meters away around obstacles, seen by
# the head lidar, with no map. Everything is in the odom frame of walker_node's
# leg odometry, so goals are relative to where the policy started.
#
# Starting points: nav2_bringup's Jazzy params and Adyansh04/grove-g1 (a G1
# with its own walking policy in MuJoCo). Reasons for our values are next to
# them; details in context/lidar-nav2-research.md.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    # ms to wait for a server (planner, controller, behaviors) to accept a request. At
    # Nav2's 20 a busy Mac (or two course runs at once) timed out, and every
    # recovery failed at once.
    default_server_timeout: 200
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # default_nav_to_pose_bt_xml (our behavior_trees/navigate.xml) is set by nav2.launch.py.

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    enable_stamped_cmd_vel: false   # walker_node takes geometry_msgs/Twist
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5   # we never command sideways steps
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Turning in place and GR00T's slow start look like no progress for a while.
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # GR00T drifts about 0.1 m after it stops.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
    FollowPath:
      # Park & Kuipers' law, the same as move_distance --to (smooth_control.py).
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.5
      min_lookahead: 0.3
      max_lookahead: 1.0
      k_phi: 2.0
      beta: 0.4
      lambda: 2.0
      # GR00T walks at about 85% of the command, and below |cmd| 0.05 it
      # switches to standing still, so the minimums stay well above that.
      v_linear_min: 0.1
      v_linear_max: 0.3
      v_angular_max: 0.6
      v_angular_min_in_place: 0.3
      slowdown_radius: 0.8
      initial_rotation: true
      initial_rotation_tolerance: 0.75
      prefer_final_rotation: true
      allow_backward: false
      in_place_collision_resolution: 0.1

# Both costmaps read the head lidar the same way, through STVL
# (spatio_temporal_voxel_layer, built from src/), whose marks fade:
#  - marking: points 0.08-1.8 m above the floor, up to 3 m away. Past 3 m,
#    torso tilt makes floor points look like obstacles. STVL has no minimum
#    range, so the robot's own arms get marked, but they are always inside the
#    footprint (0.355 m from base_link, robot_radius 0.4), which STVL clears.
#  - clearing: marks inside the lidar's view (to 3 m) that aren't hit again
#    fade within about 2 s (decay_acceleration), so a person's trail goes
#    away. STVL's lidar view is symmetric about the lidar's plane, so +-52 deg
#    covers the MID-360's 52 deg down but also 7-52 deg up, which it can't
#    see; only things above the lidar (1.21 m) are affected.
#  - everything else (the blind ring near the feet, beyond 3 m, behind the
#    arms) fades after voxel_decay, 15 s.
#  - no unknown space: STVL never marks cells free, so with
#    track_unknown_space the map stayed unknown around the obstacles, the
#    inflation layer left no cost gradient there (it only spreads its
#    lethal/inscribed costs into unknown cells), and NavFn's paths hugged
#    every obstacle.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.4
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        decay_model: 0       # linear
        voxel_decay: 15.0    # s an unseen mark lasts outside the lidar's view
        mark_threshold: 0
        track_unknown_space: false
        update_footprint_enabled: true
        combination_method: 1   # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_marking lidar_clearing
        lidar_marking:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.08
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"   # "voxel" overflows PCL with our 40 m range
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clearing:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: false
          clearing: true
          model_type: 1               # 3D lidar
          min_z: 0.0                  # m from the lidar, in its plane
          max_z: 3.0                  # the marking range
          vertical_fov_angle: 1.815   # +-52 deg
          vertical_fov_padding: 0.05  # m
          horizontal_fov_angle: 6.29  # all around
          decay_acceleration: 10.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"   # "voxel" overflows PCL with our 40 m range
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      update_frequency: 2.0
      publish_frequency: 1.0
      # No map: a window that moves with the robot, big enough for goals
      # about 9 m away (it is centered on the robot).
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      robot_radius: 0.4
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      # The same lidar layer and inflation as the local costmap.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        decay_model: 0       # linear
        voxel_decay: 15.0    # s an unseen mark lasts outside the lidar's view
        mark_threshold: 0
        track_unknown_space: false
        update_footprint_enabled: true
        combination_method: 1   # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: lidar_marking lidar_clearing
        lidar_marking:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.08
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"   # "voxel" overflows PCL with our 40 m range
          voxel_min_points: 0
          clear_after_reading: true
        lidar_clearing:
          data_type: PointCloud2
          topic: /utlidar/cloud_livox_mid360
          marking: false
          clearing: true
          model_type: 1               # 3D lidar
          min_z: 0.0                  # m from the lidar, in its plane
          max_z: 3.0                  # the marking range
          vertical_fov_angle: 1.815   # +-52 deg
          vertical_fov_padding: 0.05  # m
          horizontal_fov_angle: 6.29  # all around
          decay_acceleration: 10.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"   # "voxel" overflows PCL with our 40 m range
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true   # plan through unknown space (there is none with STVL, see above)

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    # Only turning and waiting: backing up is risky for a walking robot.
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
