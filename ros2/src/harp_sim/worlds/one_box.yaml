# Pass criteria for course tests on this world (runs check, summary.json).
# From the 2026-10-26 baselines (22-29 s, closest 0.50-0.51 m, end 0.18 m off),
# loosened for run-to-run spread.
must_succeed: true
max_time_s: 40
min_clearance_m: 0.35
max_contacts: 0
max_recoveries: 1
max_end_error_m: 0.35
