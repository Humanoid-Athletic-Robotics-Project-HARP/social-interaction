[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "harp-ros2"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# Builds Unitree's messages (unitree_ros2, cloned next to this repo) into
# install/. ROS loads message libraries by name, and pixi doesn't pass
# DYLD_LIBRARY_PATH on macOS, so the libraries are also linked into the
# environment's lib/, where ROS looks.
build = "colcon build --merge-install --base-paths ../../unitree_ros2/cyclonedds_ws/src/unitree --cmake-args -DBUILD_TESTING=OFF -DCMAKE_INSTALL_RPATH=$PIXI_PROJECT_ROOT/install/lib && ln -sf $PIXI_PROJECT_ROOT/install/lib/libunitree_*.dylib $CONDA_PREFIX/lib/"

# The Unitree messages built by `pixi run build`, and the DDS settings of
# sim/run_sim.py: domain 1 on loopback. The real robot uses domain 0 and the
# interface on 192.168.123.x instead.
[activation]
scripts = ["install/setup.sh"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_DOMAIN_ID = "1"
CYCLONEDDS_URI = '<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface name="lo0"/></Interfaces></General></Domain></CycloneDDS>'

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-rmw-cyclonedds-cpp = ">=2.2.3,<3"
ros-jazzy-rosidl-generator-dds-idl = ">=0.11.1,<0.12"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.4,<5"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"
