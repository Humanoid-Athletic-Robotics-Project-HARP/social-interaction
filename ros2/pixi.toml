[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "harp-ros2"
platforms = [{ name = "mac", platform = "osx-arm64", macos = "14.0" }]   # the mujoco 3.17 and onnxruntime 1.31 wheels need macOS 14+
version = "0.1.0"

[tasks]
# Builds our packages (src/) and Unitree's messages (unitree_ros2, cloned next
# to this repo) into install/. --symlink-install links our Python files, so
# edits take effect without rebuilding. ROS loads message libraries by name,
# and pixi doesn't pass DYLD_LIBRARY_PATH on macOS, so Unitree's libraries and
# STVL's service libraries are also linked into the environment's lib/, where
# ROS looks. The module path
# lets STVL's openvdb_vendor find the environment's OpenVDB instead of
# downloading and building its own; ignoring Homebrew keeps CMake from mixing
# in Homebrew's Boost.
build = { cmd = "colcon build --merge-install --symlink-install --base-paths src ../../unitree_ros2/cyclonedds_ws/src/unitree --cmake-args -DBUILD_TESTING=OFF -DCMAKE_INSTALL_RPATH=$PIXI_PROJECT_ROOT/install/lib -DCMAKE_MODULE_PATH=$CONDA_PREFIX/lib/cmake/OpenVDB -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew && ln -sf $PIXI_PROJECT_ROOT/install/lib/libunitree_*.dylib $PIXI_PROJECT_ROOT/install/lib/libspatio_temporal_voxel_layer__*.dylib $CONDA_PREFIX/lib/", cwd = "." }

# Our packages and the Unitree messages built by `pixi run build`, and the DDS
# settings. The robot's own topics (rt/lowstate, rt/lowcmd) are on DDS domain
# 0 on the robot and 1 in our sim; ROS 2 runs on domain 2, because CycloneDDS
# can't have both in one process (walker_node) on the same domain. To look at
# the sim's raw topics with ros2 tools, set ROS_DOMAIN_ID=1 for that command.
[activation]
scripts = ["install/setup.sh"]

[activation.env]
# unitree_sdk2py's cyclonedds bindings build against ROS's CycloneDDS 0.10.5,
# so ROS and the SDK share one DDS library.
CYCLONEDDS_HOME = "$CONDA_PREFIX"
# Unitree's G1 model (unitree_mujoco, cloned next to this repo), for the sim
# and the leg odometry.
HARP_G1_SCENE = "$PIXI_PROJECT_ROOT/../../unitree_mujoco/unitree_robots/g1/scene_29dof.xml"
# Recorded runs (harp_eval run_recorder): runs/ at the repo root, gitignored.
HARP_RUNS_DIR = "$PIXI_PROJECT_ROOT/../runs"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_DOMAIN_ID = "2"
CYCLONEDDS_URI = '<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface name="lo0"/></Interfaces></General></Domain></CycloneDDS>'

[dependencies]
python = "3.12.*"   # the version our pins were tested on; cyclonedds 0.10.2 doesn't build on 3.13+
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-rmw-cyclonedds-cpp = ">=2.2.3,<3"
ros-jazzy-rosidl-generator-dds-idl = ">=0.11.1,<0.12"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.4,<5"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"
# Nav2, only the parts we use (RoboStack has no nav2-docking, so not the
# navigation2 metapackage or nav2_bringup's launch files).
ros-jazzy-nav2-bt-navigator = ">=1.3.13,<2"
ros-jazzy-nav2-controller = ">=1.3.13,<2"
ros-jazzy-nav2-planner = ">=1.3.13,<2"
ros-jazzy-nav2-behaviors = ">=1.3.13,<2"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.13,<2"
ros-jazzy-nav2-costmap-2d = ">=1.3.13,<2"
ros-jazzy-nav2-navfn-planner = ">=1.3.13,<2"
ros-jazzy-nav2-graceful-controller = ">=1.3.13,<2"
ros-jazzy-nav2-rviz-plugins = ">=1.3.13,<2"
ros-jazzy-nav2-simple-commander = ">=1.3.13,<2"
# STVL (spatio_temporal_voxel_layer, built from src/): a costmap layer whose
# marks fade, for moving obstacles. RoboStack has no build of it.
openvdb = ">=13.1.0,<14"
ros-jazzy-laser-geometry = ">=2.7.2,<3"
ros-jazzy-pcl-conversions = ">=2.6.5,<3"
ros-jazzy-tf2-sensor-msgs = ">=0.36.23,<0.37"
ros-jazzy-ament-cmake-vendor-package = ">=2.5.6,<3"

[pypi-dependencies]
# The versions we tested; mujoco's wheel also brings mjpython for the macOS viewer.
mujoco = "==3.17.0"
onnxruntime = "==1.31.0"
unitree_sdk2py = { path = "../../unitree_sdk2_python", editable = true }

[pypi-options]
# Build the DDS bindings from source against CYCLONEDDS_HOME instead of a
# wheel that bundles its own copy of CycloneDDS.
no-binary = ["cyclonedds"]
